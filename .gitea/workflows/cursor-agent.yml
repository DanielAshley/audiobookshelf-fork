name: Cursor Agent

# Trigger when someone @cursor-mentions in an issue or PR comment.
# Requires repo secrets: CURSOR_API_KEY, CURSOR_GITEA_TOKEN
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  cursor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flow96/cursor-gitea-agent@main
        with:
          cursor_api_key: ${{ secrets.CURSOR_API_KEY }}
          gitea_token: ${{ secrets.CURSOR_GITEA_TOKEN }}
          gitea_base_url: http://192.168.0.126:3000
          ai_model: composer-2.5
